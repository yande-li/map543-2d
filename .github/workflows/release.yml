name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node - <<'EOF'
          const fs = require('node:fs');
          const version = (process.env.VERSION || '').replace(/^v/, '');
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex((l) => l.startsWith(`## [${version}]`));
          if (start === -1) {
            throw new Error(`No changelog section found for version ${version}`);
          }
          const end = lines.findIndex((l, i) => i > start && l.startsWith('## ['));
          const body = lines.slice(start + 1, end === -1 ? lines.length : end).join('\n').trim();
          if (!body) {
            throw new Error(`Empty changelog section for version ${version}`);
          }
          fs.writeFileSync('release-notes.md', body + '\n');
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: map543-2d-*.tgz
